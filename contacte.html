<!DOCTYPE html>

       <meta charset="UTF-8">

        <!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Botiga de Roba - Contacte</title>
  <link rel="stylesheet" href="global.css">
  <style>
    /* Estils de contacte */
    .contacte-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    /* Columna A: Formulari */
    .formulari {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .campo input, .campo textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button[type="submit"] {
      background-color: #ff9900;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
    }

    /* Columna B: Informació i Mapa */
    .informacio {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .mapa-fictici {
      background-color: #ccc;
      height: 150px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: #444;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo">ModaJove</a>
      <ul class="menu">
        <li><a href="index.html">Inici</a></li>
        <li><a href="productes.html">Productes</a></li>
        <li><a href="contacte.html" class="active">Contacte</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="container">
      
      <h1>Contacta amb nosaltres</h1>
      <br>

      <!-- Grid de 2 columnes -->
      <div class="contacte-grid">
        
        <!-- Columna A -->
        <div class="formulari">
          <h2>Formulari</h2>
          <br>
          <form action="#">
            <div class="campo">
              <label for="nom">Nom:</label>
              <input type="text" id="nom" name="nom" required>
            </div>

            <div class="campo">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
              <label for="missatge">Missatge:</label>
              <textarea id="missatge" name="missatge" rows="4" required></textarea>
            </div>

            <button type="submit">Enviar</button>
          </form>
        </div>

        <div class="informacio">
          <h2>Informació</h2>
          <br>
          <p><strong>Adreça:</strong> Carrer Major, 12, Barcelona</p>
          <br>
          <p><strong>Telèfon:</strong> 93 123 45 67</p>
          <br>
          <p><strong>Horari:</strong> Dilluns a Dissabte de 10h a 20h</p>

          <div class="mapa-fictici">
            [ Mapa de Google fictici ]
          </div>
        </div>

      </div>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 ModaJove - Tots els drets reservats</p>
    <p>Correu: <a href="mailto:info@modaZara.com">info@Zara.com</a></p>
  </footer>

</body>
</html>
